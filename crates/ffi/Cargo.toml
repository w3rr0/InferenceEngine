[package]
name = "inference-engine-ffi"
version = "0.1.0"
edition = "2024"

[lib]
name = "_bindings"
crate-type = ["cdylib"]

[package.metadata.maturin]
module-name = "inference_engine._bindings"

[dependencies]
pyo3 = { version = "0.29.3", features = ["extension-module", "experimental-inspect"] }
engine_core = { path = "../core" }